value_comparison_threshold = 0.01
scale_comparison_threshold = 0.01

[requirements]
system_memory = 8192
gpu_support = 1
gpu_memory = 8192

[tags]
tags = nhlbi,3drt

[nhlbi]
description = Prescan CSM generation
noise_file = csm_prescan/noise_data.h5
baseline_recon_time = 56.2

