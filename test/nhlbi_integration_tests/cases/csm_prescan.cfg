[dependency.siemens]
data_file = csm_prescan/noise_data.h5
measurement = 0
additional_arguments = skip_converstion

[dependency.client]
configuration = default_measurement_dependencies.xml

[reconstruction.siemens]
data_file = csm_prescan/recon_data.h5
measurement = 0
additional_arguments = skip_converstion

[reconstruction.client]
configuration = spiral_3DRT_CSM_test.xml

[reconstruction.test]
reference_file = csm_prescan/baseline_output.h5
reference_images = spiral_3DRT_CSM_test.xml/image_0
